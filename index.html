
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg в проекте нет, есть только favicon.ico. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Заголовок и описание задаёт компонент PageSeo на каждой странице. Здесь
      они стояли тоже — и в готовой странице оказывалось по два тега
      description и og:title. Дубли метатегов поисковики считают ошибкой:
      ровно за это ругается наш собственный аудит.
    -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://rbkwhejnhiwmktqwkakz.supabase.co" />
    
    <!-- Preload critical fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>SEO Аудит и Оптимизация</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Сторонний скрипт cdn.gpteng.co (редактор Lovable) убран с боевой страницы.
      Он грузился на каждой странице сайта, имел полный доступ к ней — включая
      формы и сессию вошедшего пользователя, — а сейчас ещё и не отвечает, то
      есть каждая страница ждала недоступный домен. Для работы сайта он не нужен.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
